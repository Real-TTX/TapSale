services:
  tabsale:
    container_name: tabsale
    image: tabsale:${TABSALE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
        VERSION: ${TABSALE_VERSION:-local-20260802}
    ports:
      - "9262:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - tabsale-data:/app/data
    restart: unless-stopped

volumes:
  tabsale-data:
    name: tabsale-data
