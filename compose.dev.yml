services:
  tapsale:
    container_name: tapsale-dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
        VERSION: ${TAPSALE_VERSION:-local-20260802}
    ports:
      - "9262:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - tapsale-dev-data:/app/data
    restart: unless-stopped

volumes:
  tapsale-dev-data:
    # Keep the physical volume name so existing SQLite data and session keys remain available.
    name: tabsale-dev-data
