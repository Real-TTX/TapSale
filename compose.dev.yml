services:
  tabsale:
    container_name: tabsale-dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
        VERSION: ${TABSALE_VERSION:-local-20260802}
    ports:
      - "9262:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - tabsale-dev-data:/app/data
    restart: unless-stopped

volumes:
  tabsale-dev-data:
    name: tabsale-dev-data
